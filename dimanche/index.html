<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFBFFF">
<title>Oui pour la fête (encore) · Manon &amp; Yannis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FFBFFF;
  --red:#CC0000;
  --text:#B00000;
  --line:rgba(176,0,0,.35);
  --sans:"Jost","Futura PT",Futura,"Century Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--pink)}
body{margin:0;background:var(--pink);color:var(--text);font-family:var(--sans);font-weight:400;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{width:min(100% - 3rem, 40rem);margin-inline:auto;position:relative}
.light{font-weight:300}
.script{display:block;height:auto}
h2{margin:0}

/* Hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:3rem 0 2.5rem}
.hero .lettrage{width:min(82vw,30rem);margin:0 auto}
.byline{display:inline-block;text-align:left;margin-top:2.5rem;color:var(--red);line-height:1.15}
.byline .avec{font-weight:300;font-size:.95rem;letter-spacing:.12em;padding-left:.15rem}
.byline .names{font-weight:600;font-size:clamp(1.6rem,5vw,2.1rem);display:block}
.byline .date{font-weight:300;font-size:1.05rem;letter-spacing:.06em;display:block;text-align:right}
.hero nav{margin-top:3rem;display:flex;gap:.6rem 1.5rem;justify-content:center;flex-wrap:wrap;font-weight:300;letter-spacing:.04em}
.hero nav a{text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}

/* Intro */
.intro{padding:4rem 0 5rem;text-align:center;color:var(--red)}
.intro .kicker{font-weight:300;font-size:1.3rem;margin:0}
.intro .oui{width:min(70vw,20rem);margin:.4rem auto .2rem}
.intro .dates{font-weight:300;font-size:1.3rem;margin:0 0 2.8rem}
.intro p{margin:0 0 1.4rem;font-weight:300;font-size:1.15rem}
.btn{display:inline-block;margin:1.4rem 0 1rem;background:var(--red);color:var(--pink);text-decoration:none;padding:1rem 2.3rem;border-radius:999px;font-weight:400;letter-spacing:.05em;transition:transform .2s ease}
.btn:hover{transform:rotate(-2deg) scale(1.03)}
.deadline{font-size:1rem !important}
.intro .coeur{width:7.5rem;margin:3rem auto 0;transform-origin:bottom center;animation:wiggle 3.5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* Programme */
.programme{padding:5rem 0 4rem;position:relative;overflow:hidden;border-top:1px solid var(--line)}
.programme .disco{position:absolute;top:0;right:max(.5rem, calc(50% - 22rem));width:clamp(4.5rem,13vw,7rem);transform-origin:top center;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.programme .ask{font-weight:300;font-size:1.25rem;color:var(--red);margin:0 0 2.5rem}
.day{margin-bottom:3rem}
.day .script{height:clamp(2.6rem,9vw,3.6rem);width:auto;margin:0 0 1.4rem -.3rem}
.slot{display:grid;grid-template-columns:4.5rem 1fr;gap:1rem;padding:.55rem 0}
.slot time{font-weight:300;padding-top:.15rem}
.slot b{display:block;font-weight:400;font-size:1.2rem;color:var(--red)}
.slot span{font-weight:300}
.programme .danse{width:clamp(6rem,20vw,9rem);margin:1rem 0 0 -.5rem}

/* Lieu */
.lieu{padding:5rem 0 4.5rem;text-align:center;border-top:1px solid var(--line);position:relative}
.lieu address{font-style:normal;font-weight:300;font-size:1.1rem;line-height:1.5;margin-bottom:2rem}
.lieu address b{font-weight:600;color:var(--red);display:block;margin-bottom:.2rem}
.links{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.ghost{display:inline-block;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:.65rem 1.4rem;text-decoration:none}
.ghost:hover{background:var(--red);color:var(--pink)}
.section-title{font-weight:300;font-size:1.3rem;color:var(--red);margin:0 0 2rem}

/* Infos */
.infos{padding:4.5rem 0 4rem;border-top:1px solid var(--line)}
.infos h2{font-weight:300;font-size:1.3rem;color:var(--red);text-align:center;margin:0 0 2.2rem}
.info{padding:1.5rem 0;border-top:1px solid var(--line)}
.info:last-child{border-bottom:1px solid var(--line)}
.info h3{font-weight:600;font-size:1.15rem;margin:0 0 .5rem;color:var(--red)}
.info p{margin:0;font-weight:400}
.info p+p{margin-top:.9rem}
.info p b{font-weight:600;color:var(--red)}
.todo{background:rgba(255,255,255,.55);padding:0 .3rem;border-radius:3px}

/* Fin */
.fin{padding:3rem 0 4rem;text-align:center;overflow:hidden}
.cortege{display:flex;align-items:flex-end;justify-content:center;gap:clamp(.4rem,2vw,1.5rem);margin:0 auto 2.5rem;width:min(100% - 1rem,44rem)}
.cortege img{height:auto}
.cortege .oeil{width:22%;margin-bottom:4%}
.cortege .couple{width:44%}
.cortege .discofleur{width:22%;margin-bottom:3%}
.in-view .cortege .couple{animation:walk 2.4s cubic-bezier(.2,.7,.2,1) both}
.in-view .cortege .oeil{animation:hop 2.4s .2s ease-out both}
.in-view .cortege .discofleur{animation:hop 2.4s .35s ease-out both}
@keyframes walk{from{transform:translateX(-60vw)}to{transform:none}}
@keyframes hop{0%{opacity:0;transform:translateY(20px)}60%{opacity:1;transform:translateY(-6px)}100%{transform:none}}
.js .fin:not(.in-view) .cortege img{opacity:0}
.fin p{margin:0;font-weight:300;font-size:1.15rem;color:var(--red)}
.fin .signature{width:min(55vw,13rem);margin:1.2rem auto 0}

@media (max-width:560px){
  .programme{padding-top:9rem}
  .programme .disco{width:3.8rem}
  .slot{grid-template-columns:3.6rem 1fr;gap:.7rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .programme .disco,.intro .coeur,.in-view .cortege img{animation:none}
  .js .fin:not(.in-view) .cortege img{opacity:1}
}
.sunday{min-height:100svh;display:grid;place-items:center;text-align:center;padding:10rem 0 3rem;position:relative;overflow:hidden;color:var(--red)}
.sunday .disco{position:absolute;top:0;right:max(.5rem,calc(50% - 16rem));width:clamp(4rem,12vw,6rem);transform-origin:top center;animation:sway 6s ease-in-out infinite}
.sunday h1{font-weight:600;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.15;margin:0 0 2rem}
.sunday h1 span{display:block;font-weight:300}
.sunday p{margin:0 0 1.2rem;font-weight:300;font-size:1.15rem}
.sunday .when{font-weight:400;font-size:1.3rem;margin:2rem 0}
.dress{margin:2.4rem 0 1rem}
.dress small{display:block;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase}
.dress b{font-weight:600;font-size:1.25rem}
.sunday .danse{width:8rem;margin:2.5rem auto 0}
.back{display:inline-block;margin-top:2rem;font-weight:300}
</style>
</head>
